<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insight Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--sep:rgba(84,84,88,.55);
  --text:#fff;--muted:#98989f;--accent:#0a84ff;--green:#30d158;--orange:#ff9f0a;
  --brand:#2f66ff;--stage:radial-gradient(1200px 600px at 50% -10%,#1b2650 0%,#0d1226 45%,#070a14 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#070a14;background-image:var(--stage);color:var(--text);min-height:100vh;padding:72px 16px 96px;-webkit-font-smoothing:antialiased}
.hero{text-align:center;max-width:760px;margin:0 auto 64px}
.brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px}
.brand svg{width:48px;height:48px;filter:drop-shadow(0 8px 20px rgba(47,102,255,.35))}
.brand span{font-size:24px;font-weight:700;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.sub{margin-top:16px;font-size:18px;color:#aab1c8;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.chips span{font-size:13px;font-weight:500;color:#c9cfe2;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.devices{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start}
figure{display:flex;flex-direction:column;align-items:center;gap:20px}
figcaption{font-size:15px;color:#aab1c8;font-weight:500}
figcaption b{color:#fff;font-weight:600}

/* Device */
.phone{width:417px;height:876px;border-radius:66px;background:#0e0e10;padding:12px;flex-shrink:0;
  box-shadow:0 0 0 1.5px #3a3a40,0 0 0 4px #141418,0 40px 80px -20px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:100%;border-radius:55px;overflow:hidden;background:var(--bg);color:var(--text);font-size:17px}
.island{position:absolute;top:11px;left:50%;translate:-50%;width:126px;height:37px;border-radius:20px;background:#000;z-index:5}
.status{position:relative;z-index:4;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 44px;font-weight:600;font-size:16px}
.status .icons{display:flex;gap:6px;align-items:center}
.content{padding:0 16px 120px;height:calc(100% - 54px);overflow:hidden}
.home-ind{position:absolute;bottom:8px;left:50%;translate:-50%;width:134px;height:5px;border-radius:3px;background:#fff;opacity:.85;z-index:6}

/* Shared iOS pieces */
.navbtns{display:flex;justify-content:flex-end;gap:10px;height:44px;align-items:center}
.circle-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:#fff}
.large-title{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.dateline{color:var(--muted);font-size:15px;margin-top:2px}
.card{background:var(--surface);border-radius:22px}
.section-h{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:26px 4px 10px}
.list{background:var(--surface);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px}
.row+.row .row-body{border-top:.5px solid var(--sep)}
.row-body{flex:1;display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}
.mono{width:32px;height:32px;border-radius:50%;background:linear-gradient(#a1a1a8,#6e6e75);display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.id{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:var(--accent);font-weight:600;font-size:17px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* Floating glass tab bar */
.tabbar{position:absolute;bottom:26px;left:14px;right:14px;height:64px;border-radius:999px;z-index:4;
  background:rgba(37,37,42,.72);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.45);
  display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.tab{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:#d1d1d6}
.tab.on{background:rgba(10,132,255,.2);color:#3d9bff}
.tab svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Kiosk */
.cam{position:relative;height:420px;border-radius:26px;overflow:hidden;margin-top:6px;
  background:radial-gradient(260px 220px at 50% 38%,#4a4038 0%,#2a2521 55%,#151311 100%)}
.cam .wall{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 64px),linear-gradient(180deg,transparent 70%,rgba(0,0,0,.35))}
.cam .person{position:absolute;left:50%;bottom:-6px;translate:-50%;width:250px;height:300px}
.facebox{position:absolute;left:50%;top:164px;translate:-50%;width:150px;height:164px}
.facebox i{position:absolute;width:30px;height:30px;border:3px solid var(--green);border-radius:4px}
.facebox i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.facebox i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.facebox i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.facebox i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.glass-chip{position:absolute;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(20,20,22,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.kcard{margin-top:12px;padding:18px 20px 20px;text-align:center}
.khead{display:flex;justify-content:space-between;align-items:flex-start;text-align:left}
.khead b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.khead small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.avatar{position:relative;width:104px;height:104px;margin:6px auto 0;border-radius:50%;background:linear-gradient(#a1a1a8,#6e6e75);display:grid;place-items:center;font-size:40px;font-weight:600;letter-spacing:-.02em}
.avatar .badge{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:var(--green);border:4px solid var(--surface);display:grid;place-items:center}
.kname{font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:12px}
.kstatus{color:var(--green);font-size:17px;font-weight:600;margin-top:2px}
.progress{margin-top:18px;text-align:left}
.progress .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress .lbl b{color:#fff;font-size:20px;font-weight:700;margin-right:3px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:75%;background:var(--green);border-radius:3px}

/* Today */
.session{padding:18px;margin-top:18px}
.live{color:var(--green);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.session-top{display:flex;justify-content:space-between;gap:12px}
.session h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
.session .meta{color:var(--muted);font-size:14px;margin-top:4px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:26px;font-weight:700;line-height:1}
.ring small{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0}
.stats b{display:block;font-size:20px;font-weight:700}
.stats span{font-size:13px;color:var(--muted)}

/* Reports */
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;margin-top:14px}
.seg span{flex:1;text-align:center;font-size:14px;font-weight:600;padding:7px 0;border-radius:999px;color:#d1d1d6}
.seg span.on{background:#636366;color:#fff}
.filter{display:inline-flex;align-items:center;gap:4px;margin-top:12px;height:32px;padding:0 12px;border-radius:999px;background:rgba(10,132,255,.18);color:#3d9bff;font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;padding:16px;margin-top:14px;row-gap:16px}
.kpis div:nth-child(even){padding-left:16px;border-left:.5px solid var(--sep)}
.kpis small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.kpis b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpis span{font-size:12.5px;color:var(--muted)}
.chart{padding:16px;margin-top:14px}
.chart h3{font-size:17px;font-weight:700}
.chart p{font-size:13px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.plot{position:relative;height:150px;margin-top:12px;display:flex;align-items:flex-end;gap:8px;padding-left:22px;
  background:linear-gradient(var(--sep) 0 .5px,transparent .5px) 22px 0/100% 50px repeat-y}
.plot .y{position:absolute;left:0;top:-7px;bottom:-7px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col i{display:block;border-radius:4px 4px 0 0}
.col i+i{border-radius:0}
.col .late{background:var(--orange)}
.col .ok{background:var(--accent)}
.xs{display:flex;gap:8px;padding-left:22px;margin-top:6px;font-size:11px;color:var(--muted)}
.xs span{flex:1;text-align:center}

@media (max-width:460px){.phone{zoom:.85}.devices{gap:32px}}
</style></head><body>
